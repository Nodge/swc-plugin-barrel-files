name: Changeset Check

on:
    pull_request:
        branches:
            - main

jobs:
    check-for-changeset:
        name: Check for Changeset
        runs-on: ubuntu-latest
        # Skip this check if the PR is from the changeset release PR
        if: "!contains(github.head_ref, 'changeset-release')"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # changeset status diffs against the merge base with origin/main, which a shallow clone does not have
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install

            # Files that count as a change are listed in `changedFilePatterns` of .changeset/config.json
            - name: Check for Changeset
              run: pnpm exec changeset status --since=origin/main
