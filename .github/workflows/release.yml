name: Release

on:
    push:
        branches:
            - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        name: Release
        # prevents this action from running on forks
        if: github.repository == 'nodge/swc-plugin-barrel-files'
        permissions:
            contents: write # to create release
            issues: write # to post issue comments
            pull-requests: write # to create pull request
            id-token: write # to mint the OIDC token npm exchanges for publish rights
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
              with:
                  toolchain: stable
                  targets: wasm32-wasip1

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install

            - name: Create Release PR or Publish to npm
              id: changesets
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  pr-title: "Upcoming Release"
                  commit-message: "chore(release): version bump"
                  publish-script: pnpm ci:release
                  version-script: pnpm ci:version
