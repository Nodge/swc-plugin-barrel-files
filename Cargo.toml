[package]
name = "swc_plugin_barrel_files"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = "symbols"

[dependencies]
serde = "1"
serde_json = "1"
swc_core = { version = "82.2.0", features = [
    "ecma_plugin_transform",
    "ecma_parser",
] }
pathdiff = "0.2.3"
indexmap = "2.10.0"
